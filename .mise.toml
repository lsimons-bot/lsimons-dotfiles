# mise: https://mise.jdx.dev/

# Tools are exact-pinned on purpose: an upstream compromise must never
# arrive here by auto-download. Bump these deliberately, not implicitly.
# `zizmor` must be kept in step with the `version:` input of
# zizmorcore/zizmor-action in .github/workflows/ci.yml, otherwise
# `mise run audit` stops being a real mirror of the CI job.
[tools]
actionlint = "1.7.12"
python = "3.14.6"
ruff = "0.16.1"
shellcheck = "0.11.0"
zizmor = "1.29.0"

[tasks.check]
description = "Compile and lint Python and shell, lint workflows, validate JSON/machines, run tests, and dry-run install"
run = "python3 script/check.py"

[tasks.audit]
description = "Audit GitHub Actions workflows and dependabot config with zizmor"
# GH_TOKEN enables zizmor's online audits (impostor-commit,
# known-vulnerable-actions). Without it zizmor warns and falls back to
# offline, which is an unverified result rather than a pass -- so this
# task stops rather than printing a green it cannot back up. Inlining
# `$(gh auth token 2>/dev/null)` would swallow exactly that case, so the
# token is checked before it is used.
#
# `--collect` is deliberately omitted: the default already collects every
# input kind (workflows, actions, dependabot, pre-commit) while
# respecting .gitignore.
run = """
token=$(gh auth token 2>/dev/null) || true
if [ -z "$token" ]; then
  echo "mise run audit: no GitHub token from 'gh auth token'." >&2
  echo "zizmor's online audits (impostor-commit, known-vulnerable-actions)" >&2
  echo "would silently not run, which is an unverified result, not a pass." >&2
  echo "Run 'gh auth login' first." >&2
  exit 1
fi
GH_TOKEN="$token" zizmor --strict-collection .
"""

[tasks.ci]
description = "Everything CI runs, in the same order: check, then the workflow audit"
depends = ["check", "audit"]

[tasks.install]
description = "Run the full dotfiles installer (idempotent). Pass --dry-run to preview."
run = "python3 script/install.py"

[tasks.ci-watch]
description = "Watch GitHub Actions CI for the current branch; exits non-zero on failure"
run = """
sleep 5
remote_url=$(git remote get-url upstream 2>/dev/null || git remote get-url origin)
repo=$(echo "$remote_url" | sed -E 's|^.*github\\.com[:/]||; s|\\.git$||')
run_id=$(gh run list --repo "$repo" --branch "$(git branch --show-current)" --limit 1 --json databaseId --jq '.[0].databaseId')
if [ -z "$run_id" ]; then echo "No run found for current branch on $repo" >&2; exit 1; fi
gh run watch --repo "$repo" --exit-status "$run_id"
"""
