name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same branch/PR; never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Provisions Python, ruff, shellcheck and actionlint from
      # .mise.toml, all exact-pinned. Previously CI resolved Python
      # through setup-python and then `pip install ruff` unpinned, so it
      # could run a different ruff than any developer and had no way to
      # get the shell and workflow linters at all.
      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      # NOT `mise run install`: in this repo that is the dotfiles
      # installer, which would try to configure the runner as a
      # workstation. `check` is the read-only gate, and it already runs
      # install.py under --dry-run.
      - name: Run checks
        run: mise run check

  zizmor:
    name: Zizmor (GitHub Actions audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit GitHub Actions workflows (zizmor)
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          # The action defaults to version "latest"; pin it so a zizmor
          # release cannot turn CI red on its own. Must match the zizmor
          # in .mise.toml for `mise run audit` to be a real local mirror
          # — bump them together.
          #
          # The action validates this against a list baked into its own
          # release, so the pin requires zizmor-action >= v0.6.2. On
          # v0.6.1 it fails with "Unknown version: 1.29.0" before zizmor
          # runs at all; that is why the SHA above moved in the same
          # change.
          #
          # `collect` is deliberately left at its default, which already
          # collects every input kind (workflows, actions, dependabot,
          # pre-commit) while respecting .gitignore.
          version: "1.29.0"
